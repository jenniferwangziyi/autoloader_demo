# This is a Databricks asset bundle definition for autoloader_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: autoloader_demo
  uuid: b35c44bd-cd3c-4d95-9f40-e7d8c548fd2f

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
    variables:
      catalog: jennifer_wang
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/jennifer.wang@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jennifer.wang@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: jennifer_wang
      schema: prod
    permissions:
      - user_name: jennifer.wang@databricks.com
        level: CAN_MANAGE
